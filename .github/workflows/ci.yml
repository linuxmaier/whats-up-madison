name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned deliberately. Unpinned, CI silently follows ruff releases: 0.16.0
      # enabled new rules by default and turned this job red against unmodified
      # main (128 findings), which also skipped `test` and `deploy` since both
      # depend on it. Keep in sync with the conda env; see #249 for clearing the
      # backlog and bumping the pin.
      - run: pip install ruff==0.15.12
      - run: ruff check backend/

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests/ -v

  deploy:
    needs: [lint, frontend-lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check if backend changed
        id: backend_changed
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^backend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.backend_changed.outputs.changed == 'true'
      - run: flyctl deploy --remote-only
        if: steps.backend_changed.outputs.changed == 'true'
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
